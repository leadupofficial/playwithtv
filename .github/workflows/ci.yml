# Checks every push and pull request. Deliberately has NO secrets and read-only permissions: it runs
# contributors' code, so it must have nothing worth stealing. Deployment is never done from GitHub.
name: ci

on:
  push:
    branches: [main]
  pull_request:          # never pull_request_target: that would run fork code with repository secrets

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # typecheck and every unit test (a few minutes)
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # third-party actions are pinned to exact commits, so a re-tagged release cannot change what runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

  # end-to-end against the production build, with every security header active; split four ways so the
  # whole suite finishes in about 15 minutes instead of running into the job time limit
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Microsoft's Playwright image already holds Chromium and every system library it needs: installing them on
    # a bare runner spent up to 12 minutes retrying slow Ubuntu font mirrors. Keep the tag in step with
    # @playwright/test in package.json (pinned by digest, like the actions).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # third-party actions are pinned to exact commits, so a re-tagged release cannot change what runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright test -c playwright.prod.config.ts --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # every playable game against its performance budget (docs/performance.md); runs beside the tests
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Microsoft's Playwright image already holds Chromium and every system library it needs: installing them on
    # a bare runner spent up to 12 minutes retrying slow Ubuntu font mirrors. Keep the tag in step with
    # @playwright/test in package.json (pinned by digest, like the actions).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf
      - if: always()
        run: cat test-results/perf/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: test-results/
          retention-days: 14
